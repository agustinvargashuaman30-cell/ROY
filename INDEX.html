<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR con Historial de Tiempo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <div class="container mx-auto p-4 max-w-md flex-grow">
        <header class="bg-blue-600 text-white p-4 rounded-xl shadow-md text-center mb-6">
            <h1 class="text-2xl font-bold">Escáner de Códigos</h1>
            <p class="text-xs text-blue-100 mt-1">Reconocimiento rápido y registro de tiempo</p>
        </header>

        <div class="bg-white p-4 rounded-xl shadow-md mb-6 text-center">
            <div id="reader" class="overflow-hidden rounded-lg bg-gray-900 border border-gray-200"></div>
            
            <div class="mt-4 flex gap-2 justify-center">
                <button id="btnIniciar" onclick="iniciarEscaneo()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-semibold shadow transition-all w-full">
                    📷 Activar Cámara
                </button>
                <button id="btnDetener" onclick="detenerEscaneo()" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2.5 rounded-lg font-semibold shadow transition-all hidden">
                    Detener
                </button>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-bold text-gray-700">Datos Reconocidos</h2>
                <button onclick="limpiarHistorial()" class="text-xs text-red-500 hover:underline">Borrar todo</button>
            </div>
            
            <div id="historialVacio" class="text-center py-6 text-gray-400 text-sm">
                No hay códigos escaneados aún.
            </div>

            <ul id="listaRegistros" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                </ul>
        </div>
    </div>

    <footer class="text-center py-4 text-xs text-gray-400">
        Registro automático local activo
    </footer>

    <script>
        let html5QrcodeScanner = null;
        let registros = JSON.parse(localStorage.getItem('qr_registros')) || [];

        // Inicializar mostrando el historial guardado anteriormente
        document.addEventListener("DOMContentLoaded", () => {
            actualizarInterfazHistorial();
        });

        function iniciarEscaneo() {
            // Alternar botones
            document.getElementById('btnIniciar').classList.add('hidden');
            document.getElementById('btnDetener').classList.remove('hidden');

            // Configurar el escáner en el contenedor div#reader
            html5QrcodeScanner = new Html5Qrcode("reader");

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 250 } 
            };

            // Intentar arrancar con la cámara trasera ('environment') por defecto en móviles
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Error al iniciar cámara: ", err);
                alert("No se pudo acceder a la cámara. Asegúrate de dar permisos o usar conexión segura (HTTPS).");
                detenerEscaneo();
            });
        }

        function detenerEscaneo() {
            document.getElementById('btnIniciar').classList.remove('hidden');
            document.getElementById('btnDetener').classList.add('hidden');

            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').innerHTML = ""; // Limpiar visor
                }).catch(err => console.error("Error al detener:", err));
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Emitir un pequeño sonido/vibración si el dispositivo lo soporta
            if (navigator.vibrate) navigator.vibrate(100);

            // Capturar fecha y hora del sistema
            const ahora = new Date();
            const formatoFecha = ahora.toLocaleDateString();
            const formatoHora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Crear el nuevo objeto de registro
            const nuevoRegistro = {
                texto: decodedText,
                fecha: formatoFecha,
                hora: formatoHora,
                timestamp: ahora.getTime()
            };

            // Guardar en memoria e historial
            registros.unshift(nuevoRegistro); // Añadir al principio de la lista
            localStorage.setItem('qr_registros', JSON.stringify(registros));

            actualizarInterfazHistorial();
            
            // Pausar un segundo el escaneo para evitar lecturas duplicadas inmediatas
            detenerEscaneo();
            setTimeout(() => {
                iniciarEscaneo();
            }, 1500);
        }

        function onScanFailure(error) {
            // Este callback se ejecuta constantemente mientras busca códigos en el cuadro.
            // Lo dejamos vacío para evitar saturar la consola de logs.
        }

        function actualizarInterfazHistorial() {
            const lista = document.getElementById('listaRegistros');
            const placeholder = document.getElementById('historialVacio');
            
            lista.innerHTML = "";

            if (registros.length === 0) {
                placeholder.classList.remove('hidden');
                return;
            }

            placeholder.classList.add('hidden');

            registros.forEach(reg => {
                lista.innerHTML += `
                    <li class="bg-gray-50 border-l-4 border-blue-500 p-3 rounded-r-lg shadow-xs flex flex-col gap-1">
                        <span class="font-mono font-bold text-sm text-gray-800 break-all">${escapeHTML(reg.texto)}</span>
                        <div class="flex justify-between text-[11px] text-gray-500 font-semibold mt-1">
                            <span>📅 ${reg.fecha}</span>
                            <span>⏰ ${reg.hora}</span>
                        </div>
                    </li>
                `;
            });
        }

        function limpiarHistorial() {
            if (confirm("¿Estás seguro de que deseas borrar todo el historial acumulado?")) {
                registros = [];
                localStorage.removeItem('qr_registros');
                actualizarInterfazHistorial();
            }
        }

        // Función de seguridad para evitar inyección de código si el QR contiene HTML
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
